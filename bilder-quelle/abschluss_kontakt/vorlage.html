<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt – A&C Consulting</title>
<style>
:root{--navy:#1A3A5C;--deep:#08234E;--green:#207730;--green-light:#3E9E4E;--text:#222222;--secondary:#555555;--line:#CCCCCC;--tint:#E2E8EF;--white:#FFFFFF;--light-on-dark:#C3CCDB}
*,*::before,*::after{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.contact-cta{padding:clamp(4rem,8vw,7rem) 1.5rem;background:var(--tint);color:var(--text)}.contact-cta__wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:clamp(2.5rem,7vw,6rem);align-items:center;max-width:1120px;margin:auto}.contact-cta__eyebrow{display:flex;align-items:center;gap:.65rem;margin:0 0 1.1rem;color:var(--secondary);font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.contact-cta__eyebrow::before{content:"";width:29px;height:3px;background:var(--green)}
.contact-cta h2{max-width:690px;margin:0 0 1rem;color:var(--navy);font:600 clamp(2.5rem,5vw,4.2rem)/1.07 "Source Serif 4",Georgia,serif;letter-spacing:-.015em}.contact-cta__lead{max-width:610px;margin:0;color:var(--secondary);font-size:1.05rem;line-height:1.7}.contact-cta__button{display:inline-flex;align-items:center;justify-content:center;gap:.8rem;min-height:50px;margin-top:1.8rem;padding:.8rem 1.25rem;border-radius:9px;background:var(--green);color:var(--white);font-size:.97rem;font-weight:700;text-decoration:none}.contact-cta__button:hover,.contact-cta__button:focus-visible{background:var(--navy);color:var(--white)}.contact-cta__button:focus-visible,.contact-cta__option:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.contact-cta__options{display:grid;gap:.8rem;margin:0;padding:0;list-style:none}.contact-cta__option{display:grid;grid-template-columns:46px minmax(0,1fr) 22px;gap:1rem;align-items:center;min-height:88px;padding:1rem 1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--navy);text-decoration:none;transition:background-color .2s ease,border-color .2s ease,color .2s ease}.contact-cta__option:hover,.contact-cta__option:focus-visible{border-color:var(--navy);background:var(--navy);color:var(--white)}.contact-cta__icon{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--pale);color:var(--green)}.contact-cta__icon svg{width:23px;height:23px}.contact-cta__label{display:block;margin-bottom:.2rem;color:var(--secondary);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:color .2s ease}.contact-cta__option:hover .contact-cta__label,.contact-cta__option:focus-visible .contact-cta__label{color:var(--white)}.contact-cta__value{font-size:.96rem;font-weight:700}.contact-cta__arrow{font-size:1.1rem}
@media(max-width:760px){.contact-cta__wrap{grid-template-columns:1fr}.contact-cta__options{max-width:540px}}@media(max-width:460px){.contact-cta{padding-inline:1.25rem}.contact-cta__button{width:100%}.contact-cta__option{grid-template-columns:42px minmax(0,1fr) 18px}.contact-cta__icon{width:42px;height:42px}.contact-cta__value{font-size:.88rem}}
@media(prefers-reduced-motion:reduce){.contact-cta__option{transition:none}}@media print{@page{size:A4;margin:2.3cm}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.contact-cta{padding:2cm}.contact-cta__wrap{break-inside:avoid}}
</style>
</head>
<body><section class="contact-cta" aria-labelledby="contact-cta-title"><div class="contact-cta__wrap">
<div><p class="contact-cta__eyebrow">Direkt und persönlich</p><h2 id="contact-cta-title">Wobei können wir Sie unterstützen?</h2><p class="contact-cta__lead">Schildern Sie uns kurz Ihre Situation. Wir melden uns persönlich bei Ihnen und besprechen, welche nächsten Schritte sinnvoll sind.</p><a class="contact-cta__button" href="https://a-cconsulting.ricardo-caires.workers.dev/de/kontakt/">Erstgespräch anfragen <span aria-hidden="true">→</span></a></div>
<ul class="contact-cta__options"><li><a class="contact-cta__option" href="tel:+41323732244"><span class="contact-cta__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7.4 3.5 10 7.9 7.8 10c1.2 2.7 3.4 4.9 6.2 6.2l2.1-2.2 4.4 2.6-.8 3.3c-.2.7-.8 1.1-1.5 1.1C9.8 20.4 3.6 14.2 3 5.8c-.1-.7.4-1.3 1.1-1.5l3.3-.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span><span class="contact-cta__label">Telefon</span><span class="contact-cta__value">032 373 22 44</span></span><span class="contact-cta__arrow" aria-hidden="true">→</span></a></li><li><a class="contact-cta__option" href="mailto:info@ac-co.ch"><span class="contact-cta__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span><span class="contact-cta__label">E-Mail</span><span class="contact-cta__value">info@ac-co.ch</span></span><span class="contact-cta__arrow" aria-hidden="true">→</span></a></li></ul>
</div></section></body></html>
