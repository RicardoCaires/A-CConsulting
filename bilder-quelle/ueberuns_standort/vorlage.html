<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standort Aegerten – A&C Consulting</title>
<style>
:root{--navy:#1A3A5C;--green:#207730;--text:#222222;--secondary:#555555;--line:#CCCCCC;--pale:#F2F4F6;--tint:#E2E8EF;--white:#FFFFFF}
*,*::before,*::after{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.location{padding:clamp(4rem,7vw,6.25rem) 1.5rem;background:var(--pale)}.location__wrap{display:grid;grid-template-columns:minmax(0,.85fr) minmax(420px,1.15fr);max-width:1120px;margin:auto;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--white)}.location__content{display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,5vw,3.5rem)}.location__eyebrow{display:flex;align-items:center;gap:.65rem;margin:0 0 1rem;color:var(--secondary);font-size:.76rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.location__eyebrow::before{content:"";width:29px;height:3px;background:var(--green)}
.location h2{margin:0 0 1rem;color:var(--navy);font:600 clamp(2.2rem,4vw,3.25rem)/1.13 "Source Serif 4",Georgia,serif}.location__address{margin:0 0 1.1rem;color:var(--navy);font-size:1.15rem;font-style:normal;font-weight:700;line-height:1.5}.location__text{max-width:48ch;margin:0;color:var(--secondary);font-size:.97rem;line-height:1.68}.location__button{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;align-self:flex-start;min-height:48px;margin-top:1.6rem;padding:.75rem 1.15rem;border-radius:9px;background:var(--green);color:var(--white);font-size:.95rem;font-weight:700;text-decoration:none}.location__button:hover,.location__button:focus-visible{background:var(--navy)}.location__button:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.location__visual{position:relative;display:grid;place-items:center;min-height:470px;background:var(--tint);color:var(--secondary);font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.location__visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.location__pin{position:absolute;right:1.2rem;bottom:1.2rem;display:flex;align-items:center;gap:.65rem;padding:.8rem 1rem;border-radius:8px;background:var(--navy);color:var(--white);font-size:.8rem;letter-spacing:0;text-transform:none}.location__pin svg{width:21px;height:21px;flex:none}
@media(max-width:780px){.location__wrap{grid-template-columns:1fr}.location__visual{min-height:380px;grid-row:1}.location__content{grid-row:2}}@media(max-width:480px){.location{padding-inline:1.25rem}.location__content{padding:1.5rem}.location__visual{min-height:310px}.location__button{width:100%}}
@media(prefers-reduced-motion:reduce){.location__button{transition:none}}@media print{@page{size:A4;margin:2.3cm}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.location{padding:0}.location__wrap{break-inside:avoid}}
</style>
</head>
<body><section class="location" aria-labelledby="location-title"><div class="location__wrap">
<div class="location__content"><p class="location__eyebrow">Unser Standort</p><h2 id="location-title">Persönlich für Sie da in Aegerten</h2><address class="location__address">Bielstrasse 10<br>2556 Aegerten</address><p class="location__text">Besprechungen sind bei uns vor Ort oder nach Vereinbarung bei Ihnen möglich. Planen Sie Ihre Anreise direkt über Google Maps.</p><a class="location__button" href="https://www.google.com/maps/dir/?api=1&amp;destination=Bielstrasse%2010%2C%202556%20Aegerten%2C%20Schweiz" target="_blank" rel="noopener noreferrer" aria-label="Route zur Bielstrasse 10 in 2556 Aegerten mit Google Maps planen">Route mit Google Maps planen <span aria-hidden="true">→</span></a></div>
<div class="location__visual" role="img" aria-label="Platzhalter für eine Aufnahme des Standorts in Aegerten"><span>Bildplatzhalter</span><div class="location__pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.3 7-13a7 7 0 1 0-14 0c0 6.7 7 13 7 13Z" stroke="#FFFFFF" stroke-width="2"/><circle cx="12" cy="9" r="2.5" fill="#207730"/></svg><span>Bielstrasse 10 · Aegerten</span></div></div>
</div></section></body></html>
