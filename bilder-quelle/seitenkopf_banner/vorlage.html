<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Versicherungen für Privatpersonen und Unternehmen – A&C Consulting</title>
<style>
:root{--navy-deep:#08234E;--green:#207730;--white:#FFFFFF}
*,*::before,*::after{box-sizing:border-box}body{margin:0;background:var(--navy-deep);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.insurance-hero{position:relative;display:flex;align-items:center;min-height:clamp(560px,67vw,760px);overflow:hidden;background:var(--navy-deep);isolation:isolate}.insurance-hero__image{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center}.insurance-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(8,35,78,.32)}
.insurance-hero__wrap{width:100%;max-width:1180px;margin:auto;padding:clamp(5rem,10vw,8rem) 1.5rem}.insurance-hero h1{max-width:850px;margin:0;color:var(--white);font:600 clamp(3rem,6vw,5.8rem)/1.02 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;text-wrap:balance}.insurance-hero__line{width:clamp(125px,18vw,245px);height:4px;margin-top:2rem;background:var(--green)}
@media(max-width:700px){.insurance-hero{min-height:620px}.insurance-hero__image{object-position:62% center}.insurance-hero::after{background:rgba(8,35,78,.46)}.insurance-hero__wrap{padding-inline:1.25rem}.insurance-hero h1{max-width:12ch}}
@media print{@page{size:A4 landscape;margin:0}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.insurance-hero{min-height:100vh}}
</style>
</head>
<body><header class="insurance-hero" aria-labelledby="insurance-title"><img class="insurance-hero__image" src="hero-versicherungen-seeland-lichter-v2.png" alt="Blick über das Seeland bei Dämmerung mit Stadtlichtern, Seen und Bergkette"><div class="insurance-hero__wrap"><h1 id="insurance-title">Versicherungen für Privatpersonen und Unternehmen</h1><div class="insurance-hero__line" aria-hidden="true"></div></div></header></body>
</html>
